<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact MarkOWiHu Photographer</title>
    <meta name="description" content="Get in touch with MarkOWiHu Photographer in Alicante province for enquiries, projects, events or collaborations.">
    <link rel="canonical" href="https://markowihu.es/contact.html">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
	{% include header-en.html %}
	{% include nav-en.html %}

<!-- CHANGE LOG: 02/09/26 Language switching is now managed in the header via `.lang-switch`, and page anchor jumping is handled by the bottom return links -->
        <main role="main">
        <section class="section-block">
		<!-- CHANGE LOG: 29/08/2026 1.3a Minor wording refinements -->
            <h2>Contact</h2>
            <p><strong>Enquiries, licensing or collaboration</strong></p>
            <p>Please use the form below, or contact details directly.</p>
            
            <!-- CHANGE LOG: 25/08/2026 Ver 1.3 - Added id="business-card" page anchor -->
            <div class="contact-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 2rem;">
                
                <!-- Web3Forms Contact Form -->
                <div class="form-container" id="contact-form-container">
                    <form action="https://api.web3forms.com/submit" method="POST" id="contact-form">
                        <input type="hidden" name="access_key" value="6e02a44e-589c-4792-8129-a1de82977026">
                        <input type="hidden" name="subject" value="New Contact Form Submission - MarkOWiHu.es">
                        <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                        <div style="margin-bottom: 1rem;">
                            <label for="name" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Name:</label>
                            <input type="text" name="name" id="name" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                        </div>

                        <div style="margin-bottom: 1rem;">
                            <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Email:</label>
                            <input type="email" name="email" id="email" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                        </div>

                        <div style="margin-bottom: 1rem;">
                            <label for="message" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Message:</label>
                            <textarea name="message" id="message" rows="5" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                        </div>

                        <button type="submit" style="background-color: #e60000; color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: bold;">Send Message</button>
                    </form>
                </div>

                <!-- Business Card / Direct Details -->
                <div class="card-container" id="business-card" style="text-align: center;">
                    <img src="images/business-card.jpg" alt="MarkOWiHu Photographer Business Card" style="max-width: 100%; height: auto; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                </div>
            </div>
        </section>
    </main>

	<!-- Bottom Navigation Jump Links -->
	<div class="bottom-nav-jumps">
		<a href="#contact-form-container" class="jump-content">Top of Content &uarr;</a>
		<span class="divider">|</span>
		<a href="#banner-header" class="jump-menu">Main Menu &uarr;</a>
	</div>
    {% include footer-en.html %}
</div>

<script>
    // Navigation Menu Dropdown Toggle for Mobile
    document.querySelectorAll('nav ul li > a').forEach(link => {
        link.addEventListener('click', function(e) {
            const parent = this.parentElement;
            if (parent.querySelector('ul')) {
                e.preventDefault();
                parent.classList.toggle('is-open');
            }
        });
    });
    document.addEventListener('click', function(e) {
        if (!e.target.closest('nav')) {
            document.querySelectorAll('nav ul li').forEach(li => li.classList.remove('is-open'));
        }
    });

    // Web3Forms Asynchronous Post-Submission Redirect
    const form = document.getElementById('contact-form');
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(form);
        fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: formData
        })
        .then(async (response) => {
            if (response.status === 200) {
                alert('Thank you! Your message has been sent successfully.');
                window.location.href = "index.html";
            } else {
                alert('Something went wrong. Please try again.');
            }
        })
        .catch(error => {
            alert('Submission error. Please check your network connection.');
        });
    });
</script>

</body>
</html>
