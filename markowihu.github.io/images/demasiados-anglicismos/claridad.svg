<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="600" fill="#FFFFFF"/>
<g font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">
<text x="340" y="34">Que te entiendan: claridad antes que jerga</text>
<text x="340" y="198">Cuando el contexto existe solo en tu cabeza</text>
<text x="340" y="444">La solución: aporta el contexto</text>
</g>
<g stroke-width="0.8">
<rect x="60" y="60" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="400" y="60" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<rect x="170" y="214" width="340" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="30" y="302" width="190" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="245" y="302" width="190" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="460" y="302" width="190" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="90" y="460" width="500" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
</g>
<g stroke="#5F5E5A" stroke-width="1.5" fill="none">
<line x1="286" y1="88" x2="394" y2="88" marker-end="url(#a)"/>
<line x1="300" y1="266" x2="140" y2="296" marker-end="url(#a)"/>
<line x1="340" y1="266" x2="340" y2="296" marker-end="url(#a)"/>
<line x1="380" y1="266" x2="540" y2="296" marker-end="url(#a)"/>
</g>
<g stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4">
<line x1="40" y1="168" x2="640" y2="168"/><line x1="40" y1="414" x2="640" y2="414"/><line x1="40" y1="544" x2="640" y2="544"/>
</g>
<g text-anchor="middle" dominant-baseline="central">
<text x="170" y="80" font-size="14" font-weight="bold" fill="#2C2C2A">portrait</text>
<text x="170" y="100" font-size="12" fill="#5F5E5A">lo que quieres decir</text>
<text x="510" y="80" font-size="14" font-weight="bold" fill="#712B13">«porter»</text>
<text x="510" y="100" font-size="12" fill="#993C1D">lo que el otro oye</text>
<text x="340" y="237" font-size="14" font-weight="bold" fill="#3C3489">«Esto no será del gusto de Salcedo»</text>
<text x="125" y="322" font-size="14" font-weight="bold" fill="#2C2C2A">¿Salgado?</text>
<text x="125" y="342" font-size="12" fill="#5F5E5A">fotoperiodista documental</text>
<text x="340" y="322" font-size="14" font-weight="bold" fill="#2C2C2A">¿Doris Salcedo?</text>
<text x="340" y="342" font-size="12" fill="#5F5E5A">artista conceptual</text>
<text x="555" y="322" font-size="14" font-weight="bold" fill="#2C2C2A">¿David Salcedo?</text>
<text x="555" y="342" font-size="12" fill="#5F5E5A">formador de un taller local</text>
<text x="340" y="482" font-size="14" font-weight="bold" fill="#085041">«El fotógrafo David Salcedo,</text>
<text x="340" y="504" font-size="14" font-weight="bold" fill="#085041">que nos dio formación el año pasado»</text>
</g>
<g font-size="12" fill="#5F5E5A" text-anchor="middle">
<text x="340" y="144">Un anglicismo mal pronunciado ya no comunica: solo suena a etiqueta</text>
<text x="340" y="390">El lector construye una interpretación coherente… pero ajena a la tuya</text>
<text x="340" y="568">La autenticidad creativa no necesita jerga ni pronunciaciones impostadas:</text>
<text x="340" y="586">le basta la claridad de la mirada y la precisión de la palabra.</text>
</g>
</svg>
