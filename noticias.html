<!-- Mobile Navigation Toggle Script -->
<script>
    document.querySelectorAll('nav ul li > a').forEach(link => {
        link.addEventListener('click', function(e) {
            const parent = this.parentElement;
            if (parent.querySelector('ul')) {
                e.preventDefault();
                parent.classList.toggle('is-open');
            }
        });
    });
    document.addEventListener('click', function(e) {
        if (!e.target.closest('nav')) {
            document.querySelectorAll('nav ul li').forEach(li => li.classList.remove('is-open'));
        }
    });
</script>

<!-- Dynamic Text Engine & HTTP Last-Modified Date Stamping -->
<!-- LOG DE CAMBIOS: 03/09/2026 - Carga de noticias con soporte innerHTML para formato UTF-8 y enlaces -->
<script>
    async function loadNoticiasUpdate() {
        try {
            const response = await fetch('noticias-update.txt', { cache: 'no-cache' });
            if (response.ok) {
                const textData = await response.text();
                document.getElementById('news-text-container').innerHTML = textData;

                const lastModHeader = response.headers.get('Last-Modified');
                if (lastModHeader) {
                    const modDate = new Date(lastModHeader);
                    const day = String(modDate.getDate()).padStart(2, '0');
                    const month = modDate.toLocaleString('es-ES', { month: 'short' }).replace('.', '');
                    
                    document.getElementById('news-date-container').textContent = `Última actualización: ${day} ${month}`;
                }
            }
        } catch (error) {
            console.error('Error al cargar noticias:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', loadNoticiasUpdate);
</script>
