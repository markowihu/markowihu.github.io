<!--
MarkOWiHu Fotógrafo main site menu system
LOG DE CAMBIOS:
• 06-09-2026 Ver 1.0
• 27-09-2026 Updated for dynamic language switching following new Foto Walk 2026 menu item Header ES
• 10-10-2026 Implement conditional EN disabled state for monolingual pages
-->
<header role="banner" id="banner-header" class="header-banner">
    <div class="header-titles">
        <h1>MarkOWiHu Fotógrafo</h1>
        <div class="tagline">Provincia de Alicante</div>
    </div>
    <div class="lang-switch" aria-label="Selección de idioma">
        {% if page.lang_en_url %}
            <a href="{{ page.lang_en_url }}" lang="en" title="English version">EN</a>
        {% else %}
            <span class="lang-disabled" lang="en" title="Esta página solo está disponible en castellano">EN</span>
        {% endif %}
        <span class="divider">|</span>
        <span class="lang-active" lang="es" title="Versión actual en español">ES</span>
    </div>
</header>
