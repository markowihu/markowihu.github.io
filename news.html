<!-- Mobile Navigation Toggle Script -->
<script>
    document.querySelectorAll('nav ul li > a').forEach(link => {
        link.addEventListener('click', function(e) {
            const parent = this.parentElement;
            if (parent.querySelector('ul')) {
                e.preventDefault();
                parent.classList.toggle('is-open');
            }
        });
    });
    document.addEventListener('click', function(e) {
        if (!e.target.closest('nav')) {
            document.querySelectorAll('nav ul li').forEach(li => li.classList.remove('is-open'));
        }
    });
</script>

<!-- Dynamic Text Engine & HTTP Last-Modified Date Stamping (English) -->
<!-- LOG DE CAMBIOS: 03/09/2026 - Updated news load engine to innerHTML for UTF-8 HTML formatting -->
<script>
    async function loadNewsUpdate() {
        try {
            const response = await fetch('news-update.txt', { cache: 'no-cache' });
            if (response.ok) {
                const textData = await response.text();
                document.getElementById('news-text-container').innerHTML = textData;

                const lastModHeader = response.headers.get('Last-Modified');
                if (lastModHeader) {
                    const modDate = new Date(lastModHeader);
                    const day = String(modDate.getDate()).padStart(2, '0');
                    const month = modDate.toLocaleString('en-GB', { month: 'short' }).replace('.', '');
                    
                    document.getElementById('news-date-container').textContent = `Last update: ${day} ${month}`;
                }
            }
        } catch (error) {
            console.error('Error loading news update:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', loadNewsUpdate);
</script>
